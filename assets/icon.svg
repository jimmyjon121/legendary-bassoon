<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="forge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="115" fill="url(#bg-gradient)"/>
  
  <!-- Anvil/Forge shape (stylized "D" + anvil) -->
  <g filter="url(#glow)">
    <!-- Left vertical bar of "D" -->
    <rect x="120" y="140" width="60" height="232" rx="30" fill="white" opacity="0.95"/>
    
    <!-- Curved part of "D" forming anvil -->
    <path d="M 180 156 Q 340 156 340 256 Q 340 356 180 356" 
          stroke="white" 
          stroke-width="60" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.95"/>
    
    <!-- Anvil horn (top right) -->
    <path d="M 320 180 L 380 160 L 380 200 L 340 210 Z" 
          fill="url(#forge-gradient)" 
          opacity="0.9"/>
    
    <!-- Hammer striking effect (spark) -->
    <circle cx="360" cy="170" r="8" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="375" cy="165" r="5" fill="#FFA500" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="370" cy="185" r="6" fill="#FFD700" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    
    <!-- Neural network nodes (AI theme) -->
    <circle cx="200" cy="256" r="12" fill="#4FFFB0" opacity="0.8"/>
    <circle cx="256" cy="220" r="10" fill="#4FFFB0" opacity="0.7"/>
    <circle cx="256" cy="292" r="10" fill="#4FFFB0" opacity="0.7"/>
    <circle cx="300" cy="256" r="12" fill="#4FFFB0" opacity="0.8"/>
    
    <!-- Neural connections -->
    <line x1="200" y1="256" x2="256" y2="220" stroke="#4FFFB0" stroke-width="2" opacity="0.4"/>
    <line x1="200" y1="256" x2="256" y2="292" stroke="#4FFFB0" stroke-width="2" opacity="0.4"/>
    <line x1="256" y1="220" x2="300" y2="256" stroke="#4FFFB0" stroke-width="2" opacity="0.4"/>
    <line x1="256" y1="292" x2="300" y2="256" stroke="#4FFFB0" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Subtle shadow at bottom -->
  <ellipse cx="256" cy="480" rx="180" ry="20" fill="black" opacity="0.15"/>
</svg>
